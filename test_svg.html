<!DOCTYPE html>
<html>
<body style="background: #222; display: flex; gap: 20px; padding: 40px;">
<svg width="200" height="200" viewBox="0 0 100 100">
  <!-- Outer Diamond -->
  <polygon points="50,7 93,50 50,93 7,50" fill="#ffffff" stroke="#00a4e4" stroke-width="7.5" stroke-linejoin="round" />
  
  <!-- Group rotated 45 deg -->
  <g transform="rotate(45 50 50)">
    <!-- Bar 1: Blue (left, short) -->
    <rect x="30" y="55" width="8.5" height="12" rx="1.5" fill="#00a4e4" />
    <!-- Bar 2: Amber (middle, medium) -->
    <rect x="42" y="42" width="8.5" height="25" rx="1.5" fill="#e5a900" />
    <!-- Bar 3: Lime Green (right, tall) -->
    <rect x="54" y="27" width="8.5" height="40" rx="1.5" fill="#8bc34a" />
  </g>
</svg>
</body>
</html>
