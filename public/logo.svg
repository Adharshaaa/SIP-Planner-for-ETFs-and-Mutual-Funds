<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Diamond Frame with Cyan Border and White Interior -->
  <polygon
    points="50,7.5 92.5,50 50,92.5 7.5,50"
    fill="#ffffff"
    stroke="#00a4e4"
    stroke-width="8"
    stroke-linejoin="round"
  />
  
  <!-- 3 Diagonal Growth Bars Rotated 45 Degrees -->
  <g transform="rotate(45 50 50)">
    <!-- Bar 1: Blue (left, short) -->
    <rect x="29.5" y="53" width="9" height="13.5" rx="1.5" fill="#00a4e4" />
    
    <!-- Bar 2: Golden Amber (middle, medium) -->
    <rect x="41.5" y="40" width="9" height="26.5" rx="1.5" fill="#e5a900" />
    
    <!-- Bar 3: Fresh Lime Green (right, tall) -->
    <rect x="53.5" y="25" width="9" height="41.5" rx="1.5" fill="#8bc34a" />
  </g>
</svg>
